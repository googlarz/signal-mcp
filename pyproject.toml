[project]
name = "signal-mcp"
version = "1.43.0"
description = "Signal for AI assistants: an MCP server and CLI with searchable local message history, groups, polls and 80+ tools on top of signal-cli. 100% local."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["signal", "signal-cli", "mcp", "model-context-protocol", "claude", "ai-agents", "messaging", "chat", "privacy", "local-first", "sqlite", "fts5", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.3.3",
    "cryptography>=47.0.0",
    "httpx>=0.28.1",
    # server.py is written against the mcp 2.x low-level handler API.
    "mcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/googlarz/signal-mcp"
Repository = "https://github.com/googlarz/signal-mcp"
Issues = "https://github.com/googlarz/signal-mcp/issues"
Changelog = "https://github.com/googlarz/signal-mcp/blob/main/CHANGELOG.md"

[project.scripts]
signal-mcp = "signal_mcp.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/signal_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "hatchling>=1.27.0",
    "pytest-timeout>=2.4.0",
]
